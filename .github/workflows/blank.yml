name: Create Cartoon Story Video

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create test video
        run: |
          mkdir -p output

          ffmpeg -f lavfi -i color=c=skyblue:s=1280x720:d=10 \
            -vf "drawtext=text='My Cartoon Animal Story':fontcolor=white:fontsize=50:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            output/test-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-test-video
          path: output/test-video.mp4
